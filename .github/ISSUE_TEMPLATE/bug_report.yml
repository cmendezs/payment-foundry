name: Bug report
description: Something is not working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger it. Include a code snippet or command if possible.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead. Paste the full error message or stack trace if there is one.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The released version you are using, or the commit SHA if running from source.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Which agent surface you were using (Claude Code, Antigravity, Kiro, Mistral Vibe) and OS.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        Found a security issue instead? Please do not open an issue for it. See `SECURITY.md` for how to report it privately.
